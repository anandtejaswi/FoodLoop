name: foodloop_app
description: FoodLoop – Smart Food Waste Management System connecting Givers and Takers.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Navigation
  go_router: ^13.2.0

  # HTTP / API
  http: ^1.2.1
  dio: ^5.4.3

  # State Management
  provider: ^6.1.2

  # Maps (OpenStreetMap)
  flutter_map: ^6.2.1
  latlong2: ^0.9.1

  # Local Storage / Cache
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.0.0

  # Images
  cached_network_image: ^3.3.1
  image_picker: ^1.1.2

  # UI
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.10+1
  lottie: ^3.1.2
  shimmer: ^3.0.0

  # Location
  geolocator: ^11.1.0
  geocoding: ^3.0.0

  # Date/Time
  intl: ^0.19.0

  # Icons
  font_awesome_flutter: ^10.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/lottie/

